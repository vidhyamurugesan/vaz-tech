<!-- The 404 page can be shown at any address (for example /nope/deep/x), so it first finds the
     site's root folder (the nearest folder that has layout.js), then loads the styles and scripts from there.
     This works at the domain root (live site) and inside a subfolder (XAMPP, e.g. /vaz_tech-ncxnew/vt2/). -->
<style>body{visibility:hidden}</style>
<script>
  (function () {
    var known = ["about", "work", "contact", "privacy", "terms"];
    var parts = location.pathname.split("/"); parts.pop();
    var dirs = []; while (parts.length) { dirs.push(parts.join("/") + "/"); parts.pop(); }
    function show() { document.body && (document.body.style.visibility = "visible"); }
    function start(root) {
      // Fix addresses that end in "/" (e.g. about/ -> about)
      var rel = location.pathname.slice(root.length).replace(/\/+$/, "");
      if (/\/$/.test(location.pathname) && known.indexOf(rel) !== -1) {
        location.replace(root + rel + location.search + location.hash); return;
      }
      window.SITE_ROOT = root;
      var css = document.createElement("link"); css.rel = "stylesheet"; css.href = root + "styles.css";
      css.onload = css.onerror = show; document.head.appendChild(css);
      [["image/svg+xml", "favicon.svg"], ["", "favicon.ico"]].forEach(function (f) {
        var l = document.createElement("link"); l.rel = "icon"; if (f[0]) l.type = f[0]; l.href = root + f[1]; document.head.appendChild(l);
      });
      function load(src, next) { var s = document.createElement("script"); s.src = root + src; s.onload = s.onerror = next; document.body.appendChild(s); }
      function go() {
        load("layout.js", function () { load("site.js", function () {
          // Point every relative link at the site root instead of the missing folder
          [].forEach.call(document.querySelectorAll("a[href]"), function (a) {
            var h = a.getAttribute("href");
            if (!/^(#|[a-z]+:|\/)/i.test(h)) a.setAttribute("href", root + (h === "./" ? "" : h));
          });
          show();
        }); });
      }
      if (document.body) go(); else document.addEventListener("DOMContentLoaded", go);
      setTimeout(show, 2000);
    }
    (function probe(i) {
      if (i >= dirs.length - 1) return start(dirs[dirs.length - 1] || "/");
      // A real layout.js is JavaScript; a missing one comes back as this HTML page
      fetch(dirs[i] + "layout.js", { method: "HEAD", cache: "no-store" })
        .then(function (r) { (r.ok && /javascript/i.test(r.headers.get("content-type") || "")) ? start(dirs[i]) : probe(i + 1); }, function () { probe(i + 1); });
    })(0);
  })();
</script>
